      - generic [ref=f2e711]:
        - generic [ref=f2e712]:
          - paragraph [ref=f2e713]: Everything Plumbing & More
          - heading "Helpful Plumbing Notes" [level=2] [ref=f2e714]
          - paragraph [ref=f2e715]: A few practical topics to discuss with your plumber, from noticing early warning signs to planning routine maintenance. These are sample article previews for the new brand.
        - generic [ref=f2e716]:
          - article [ref=f2e717]:
            - img "Leak repair illustration" [ref=f2e718]
            - heading "What to Tell Your Plumber About a Leak" [level=3] [ref=f2e719]
            - paragraph [ref=f2e720]: Make a note of where you noticed the water, when the problem started, and whether it changes when a fixture is used. These details can help your plumber prepare for the visit.
            - link "Ask Our Team →" [ref=f2e721] [cursor=pointer]:
              - /url: "#contact"
          - article [ref=f2e722]:
            - img "Gutter maintenance illustration" [ref=f2e723]
            - heading "Simple Signs Your Gutters Need Attention" [level=3] [ref=f2e724]
            - paragraph [ref=f2e725]: Overflowing water, loose fittings, and damp patches can be useful signs to mention when arranging an inspection. Ask about suitable maintenance for your property.
            - link "Ask Our Team →" [ref=f2e726] [cursor=pointer]:
              - /url: "#contact"
          - article [ref=f2e727]:
