            - heading "What to Tell Your Plumber About a Leak" [level=3] [ref=f3e669]
            - paragraph [ref=f3e670]: Make a note of where you noticed the water, when the problem started, and whether it changes when a fixture is used. These details can help your plumber prepare for the visit.
