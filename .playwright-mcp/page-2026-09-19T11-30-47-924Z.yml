      - generic [ref=f3e710]:
        - generic [ref=f3e711]:
          - paragraph [ref=f3e712]: Everything Plumbing & More
          - heading "Helpful Plumbing Notes" [level=2] [ref=f3e713]
          - paragraph [ref=f3e714]: A few practical topics to discuss with your plumber, from noticing early warning signs to planning routine maintenance. These are sample article previews for the new brand.
        - generic [ref=f3e715]:
          - article [ref=f3e716]:
            - img "Leak repair illustration" [ref=f3e717]
            - heading "What to Tell Your Plumber About a Leak" [level=3] [ref=f3e718]
            - paragraph [ref=f3e719]: Make a note of where you noticed the water, when the problem started, and whether it changes when a fixture is used. These details can help your plumber prepare for the visit.
            - link "Ask Our Team â†’" [ref=f3e720] [cursor=pointer]:
              - /url: "#contact"
          - article [ref=f3e721]:
            - img "Gutter maintenance illustration" [ref=f3e722]
